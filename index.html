<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JobFlow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:24px 16px 40px}h1{font-size:34px;margin:0}.sub{color:#9ca3af;margin:5px 0 22px}
.card{background:#191c23;border:1px solid #2a2f39;border-radius:18px;padding:17px;margin:12px 0}
button,label{display:inline-block;border:0;border-radius:11px;padding:11px 14px;background:#7357ff;color:#fff;font-weight:700;cursor:pointer}
.secondary{background:#292e38}.danger{background:#54242b}
input,textarea,select{width:100%;background:#101218;border:1px solid #363b46;color:#fff;border-radius:10px;padding:11px;margin:6px 0}
.row{display:flex;gap:9px;flex-wrap:wrap}.muted{color:#a4a9b3;font-size:14px}.job{display:grid;grid-template-columns:1fr auto;gap:15px}.score{font-size:23px;font-weight:800}.pill{display:inline-block;background:#282e39;border-radius:99px;padding:4px 8px;font-size:12px;margin-top:7px}a{color:#aa9cff}
@media(max-width:600px){.job{grid-template-columns:1fr}.score{font-size:20px}}
</style>
</head>
<body><main>
<h1>JobFlow</h1><div class="sub">Your global job application pipeline.</div>

<div class="card">
<h3>1. Your profile</h3>
<div class="row">
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<input id="linkedin" placeholder="LinkedIn">
</div>
<button onclick="saveProfile()">Save profile</button>
<span id="saved" class="muted"></span>
</div>

<div class="card">
<h3>2. Import jobs</h3>
<p class="muted">CSV columns: title,company,location,url,description</p>
<input id="csv" type="file" accept=".csv">
<div class="row"><button onclick="importCSV()">Import CSV</button><button class="secondary" onclick="clearJobs()">Clear jobs</button></div>
<p id="msg" class="muted"></p>
</div>

<div class="card">
<h3>3. Application queue</h3>
<div id="jobs"></div>
</div>
</main>
<script>
const pref={positive:["business operations","strategy","operations","founder","project","program","commercial","partnership","growth","ai","automation","startup","cross-functional","ownership"],
negative:["cold calling","call center","customer service","internship","intern ","graduate scheme","5+ years","4+ years","3+ years","bachelor's required","bachelor required","master's required"]};
let jobs=JSON.parse(localStorage.getItem("jobflow_jobs")||"[]");
let profile=JSON.parse(localStorage.getItem("jobflow_profile")||'{"name":"","email":"","phone":"","linkedin":""}');
for(const k of ["name","email","phone","linkedin"]) document.getElementById(k).value=profile[k]||"";

function saveProfile(){for(const k of ["name","email","phone","linkedin"])profile[k]=document.getElementById(k).value;localStorage.setItem("jobflow_profile",JSON.stringify(profile));saved.textContent=" Saved";setTimeout(()=>saved.textContent="",1500)}
function score(j){let t=(j.title+" "+j.company+" "+j.location+" "+j.description).toLowerCase(),s=50;
pref.positive.forEach(x=>{if(t.includes(x))s+=6});pref.negative.forEach(x=>{if(t.includes(x))s-=18});
["paris","amsterdam","berlin","madrid","barcelona","brussels","zurich","geneva","stockholm","copenhagen","dubai","riyadh","doha","singapore","hong kong","tokyo","seoul","toronto","montreal","new york","san francisco"].forEach(x=>{if(t.includes(x))s+=3});
return Math.max(0,Math.min(100,s))}
function parseCSV(text){let lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];
let rows=[],cur="",cells=[],q=false;for(let ch of text){if(ch=='"')q=!q;else if(ch==","&&!q){cells.push(cur);cur=""}else if((ch=="\n"||ch=="\r")&&!q){if(cur||cells.length){cells.push(cur);rows.push(cells);cells=[];cur=""}}else cur+=ch}if(cur||cells.length){cells.push(cur);rows.push(cells)}
let heads=rows.shift().map(x=>x.trim().toLowerCase()), out=[];for(let r of rows){let o={};heads.forEach((h,i)=>o[h]=(r[i]||"").trim());if(o.url)out.push(o)}return out}
function importCSV(){let f=csv.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let incoming=parseCSV(rd.result).map(j=>({...j,score:score(j),status:"queued"}));let urls=new Set(jobs.map(x=>x.url));jobs=[...jobs,...incoming.filter(x=>!urls.has(x.url))];localStorage.setItem("jobflow_jobs",JSON.stringify(jobs));msg.textContent=`Imported ${incoming.filter(x=>!urls.has(x.url)).length} new jobs.`;render()};rd.readAsText(f)}
function clearJobs(){if(confirm("Clear all jobs?")){jobs=[];localStorage.removeItem("jobflow_jobs");render()}}
function setStatus(i,status){jobs[i].status=status;localStorage.setItem("jobflow_jobs",JSON.stringify(jobs));render()}
function render(){jobs.sort((a,b)=>(b.score||score(b))-(a.score||score(a)));document.getElementById("jobs").innerHTML=jobs.length?jobs.map((j,i)=>`<div class="card job"><div><b>${esc(j.title||"Untitled")}</b><br>${esc(j.company||"")} · ${esc(j.location||"")}<br><span class="pill">${j.score||score(j)}/100 fit · ${esc(j.status||"queued")}</span><p class="muted">${esc((j.description||"").slice(0,350))}</p></div><div><div class="score">${j.score||score(j)}</div><a href="${esc(j.url)}" target="_blank" onclick="setStatus(${i},'opened')">Open application</a><br><br><select onchange="setStatus(${i},this.value)"><option ${j.status=="queued"?"selected":""}>queued</option><option ${j.status=="opened"?"selected":""}>opened</option><option ${j.status=="applied"?"selected":""}>applied</option><option ${j.status=="rejected"?"selected":""}>rejected</option></select></div></div>`).join(""):'<p class="muted">No jobs imported yet.</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body></html>
